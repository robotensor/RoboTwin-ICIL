[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotwin-icil-competition"
version = "0.1.0.dev0"
description = "The RoboTwin ICIL benchmark as a plugin of the RoboTensor ICIL competition orchestrator."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Neither is on a package index: the host installs both beside this plugin (see README.md). The
# plugin never imports icil-orchestrator; the orchestrator imports it.
dependencies = ["robotwin-icil", "icil-policy"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

# How the orchestrator finds this benchmark. The name is the id `spec.json`'s skills name.
[project.entry-points."icil.benchmarks"]
robotwin = "icil_benchmark_robotwin:BENCHMARK"

[tool.hatch.build.targets.wheel]
packages = ["src/icil_benchmark_robotwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: needs the RoboTwin simulator (SAPIEN, assets, GPU)"]
